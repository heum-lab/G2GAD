- id: reward-traffic-01
  category: service
  services: [reward-traffic]
  featured: false
  updatedAt: 2026-10-14
  question: "리워드 트래픽은 일반 광고와 무엇이 다른가요?"
  answer: |
    리워드 트래픽은 참여자가 보상을 받고 검색이나 방문 같은 활동을 직접 수행한다는 점이 다릅니다. 일반 광고는 노출된 사용자 중 관심 있는 사람만 클릭하지만, 리워드 광고는 참여 자체가 목적이 됩니다. 그래서 유입을 만들기는 쉽지만 구매 의도는 일반 광고 유입보다 낮을 수 있습니다.

- id: reward-traffic-02
  category: service
  services: [reward-traffic]
  featured: false
  updatedAt: 2026-10-14
  question: "리워드 트래픽을 하면 검색 순위가 오르나요?"
  answer: |
    아니요, 리워드 트래픽이 검색 순위 상승을 약속하지는 않습니다. 순위는 플랫폼 알고리즘이 여러 요소를 종합해 결정하며 그 기준은 공개되지 않고 수시로 바뀝니다. 굿투그레이트(G2G)는 특정 순위를 약속하지 않고 유입과 전환 지표를 기준으로 운영합니다.

- id: reward-traffic-03
  category: service
  services: [reward-traffic]
  featured: false
  updatedAt: 2026-10-14
  question: "리워드 트래픽은 플랫폼 정책에 어긋나지 않나요?"
  answer: |
    허용 범위는 플랫폼과 매체마다 다르므로 진행 전에 정책을 확인해야 합니다. 굿투그레이트(G2G)는 정책에서 허용되는 범위 안에서만 집행하고, 문제가 될 수 있는 방식은 제안하지 않습니다. 정책이 변경되면 운영 방식을 다시 검토해 안내합니다.

- id: reward-traffic-04
  category: service
  services: [reward-traffic]
  featured: false
  updatedAt: 2026-10-14
  question: "리워드 트래픽은 어떤 지표로 성과를 확인하나요?"
  answer: |
    유입 수와 함께 방문 이후의 체류, 찜이나 저장, 구매 또는 예약 같은 반응 지표를 확인합니다. 유입 수만 보면 실제 사업 성과와의 관계를 알기 어렵기 때문입니다. 확인할 지표는 목표에 맞춰 캠페인 설계 단계에서 정합니다.

- id: reward-traffic-05
  category: service
  services: [reward-traffic]
  featured: false
  updatedAt: 2026-10-14
  question: "리워드 트래픽 비용은 어떻게 정해지나요?"
  answer: |
    비용은 업종, 경쟁 강도, 목표 유입 규모, 진행 기간에 따라 달라지므로 상담 후 견적으로 안내합니다. 같은 업종이라도 대상 키워드와 매체 구성에 따라 필요한 예산이 달라집니다. 현황 진단을 거친 뒤 범위에 맞는 견적을 드립니다.

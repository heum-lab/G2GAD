  question: "체험단 블로거는 어떻게 선정하나요?"
  answer: |
    블로거의 활동 분야가 상품이나 매장과 맞는지, 평소 글의 품질이 어떤지를 기준으로 선정합니다. 방문자 수만 보고 선정하면 주제가 맞지 않아 독자 반응이 낮을 수 있습니다. 선정 기준은 브랜드와 협의해 정합니다.


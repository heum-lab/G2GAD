  question: "스마트블록은 기존 블로그 노출과 무엇이 다른가요?"
  answer: |
    스마트블록은 콘텐츠를 채널 종류가 아니라 주제 단위로 묶어 보여 준다는 점이 다릅니다. 블로그, 카페 등 여러 채널의 글이 하나의 주제 묶음 안에 함께 나타날 수 있습니다. 그래서 채널보다 주제와 검색 의도를 기준으로 콘텐츠를 기획해야 합니다.

- id: smart-block-02

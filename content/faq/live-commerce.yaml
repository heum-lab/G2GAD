  question: "라이브커머스는 어떤 상품에 적합한가요?"
  answer: |
    사용 방법이나 효과를 직접 보여 주면 이해가 빠른 상품에 적합합니다. 뷰티, 패션, 식품, 생활용품, 소형 가전 등이 대표적입니다. 상품 설명이 단순하고 가격 비교만으로 구매가 결정되는 상품은 다른 채널이 더 맞을 수 있습니다.

- id: live-commerce-02
  category: service
  services: [live-commerce]
  featured: false
  updatedAt: 2026-10-14
  question: "방송은 어디에서 진행하나요?"
  answer: |
    고객사가 상품을 판매하는 쇼핑몰의 라이브 기능이나 영상 플랫폼 중에서 목표 고객과 판매 구조에 맞는 채널을 고릅니다. 이미 운영 중인 스토어가 있다면 그 스토어의 라이브 기능을 우선 검토합니다. 채널은 상담에서 함께 정합니다.

- id: live-commerce-03
  category: service
  services: [live-commerce]
  featured: false
  updatedAt: 2026-10-14
  question: "라이브커머스 성과는 어떻게 확인하나요?"
  answer: |
    시청자 수, 채팅 반응, 방송 중 판매량과 매출, 알림 받기나 스토어 찜 같은 재방문 지표를 확인합니다. 방송 후 다시보기 조회와 이후 판매 변화도 함께 봅니다. 어떤 지표를 중심으로 볼지는 방송 목표에 맞춰 미리 정합니다.

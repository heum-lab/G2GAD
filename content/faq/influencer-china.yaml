- id: influencer-china-01
  category: service
  services: [influencer-china]
  featured: false
  updatedAt: 2026-10-14
  question: "중국에 법인이나 판매 채널이 없어도 중국 인플루언서 마케팅을 할 수 있나요?"
  answer: |
    진행은 가능하지만 목표에 따라 준비할 것이 달라집니다. 한국 매장으로의 방문 유도가 목적이라면 현지 판매 채널 없이도 진행할 수 있습니다. 중국 내 판매가 목적이라면 구매로 이어질 판매 채널과 필요한 인허가를 먼저 확인해야 합니다.

- id: influencer-china-02
  category: service
  services: [influencer-china]
  featured: false
  updatedAt: 2026-10-14
  question: "중국 인플루언서 마케팅은 어떤 플랫폼에서 진행하나요?"
  answer: |
    브랜드의 목표와 상품 분야에 맞는 중국 소셜 플랫폼을 선택해 진행합니다. 후기형 콘텐츠가 중심인 플랫폼과 짧은 영상이 중심인 플랫폼은 이용자 성향과 콘텐츠 형식이 다릅니다. 적합한 플랫폼 구성은 상담 과정에서 제안합니다.

- id: influencer-china-03
  category: service
  services: [influencer-china]
  featured: false
  updatedAt: 2026-10-14
  question: "콘텐츠 내용을 브랜드가 미리 확인할 수 있나요?"
  answer: |
    네, 게시 전에 콘텐츠 방향과 주요 내용을 브랜드와 협의합니다. 다만 인플루언서의 표현 방식을 지나치게 제한하면 콘텐츠가 광고처럼 보여 반응이 줄 수 있습니다. 사실 관계와 표기 규정은 확인하되 표현은 인플루언서의 방식을 존중하는 편이 좋습니다.

- id: influencer-china-04
  category: service
  services: [influencer-china]
  featured: false
  updatedAt: 2026-10-14
  question: "중국 인플루언서 콘텐츠에도 광고 표기를 하나요?"
  answer: |
    네, 대가가 제공된 협업 콘텐츠는 현지 플랫폼 정책과 광고 표기 규정에 따라 표기합니다. 표기를 숨기는 방식은 계정 제재나 브랜드 신뢰 하락으로 이어질 수 있습니다. 굿투그레이트(G2G)는 표기 규정을 지키는 범위에서만 협업을 진행합니다.

- id: influencer-china-05
  category: service
  services: [influencer-china]
  featured: false
  updatedAt: 2026-10-14
  question: "중국 인플루언서 마케팅 비용은 어떻게 정해지나요?"
  answer: |
    비용은 플랫폼, 인플루언서의 규모와 인원, 콘텐츠 형식, 진행 기간에 따라 달라지므로 상담 후 견적으로 안내합니다. 같은 예산이라도 인플루언서 구성에 따라 도달 범위와 콘텐츠 수가 달라집니다. 목표를 확인한 뒤 구성안과 함께 견적을 드립니다.
